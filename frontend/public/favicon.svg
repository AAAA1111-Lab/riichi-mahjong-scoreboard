<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- 45度倾角扁平化立直棒 (千点棒) -->
  <g transform="rotate(-45 32 32)">
    <!-- 立直棒主体：象牙白微光、深色抗混色边框、胶囊圆角 -->
    <rect x="3" y="23" width="58" height="18" rx="9" ry="9" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" filter="url(#shadow)"/>
    <!-- 顶部反光条 (增加轻拟物与扁平立体质感) -->
    <rect x="6" y="25" width="52" height="4" rx="2" fill="#ffffff" opacity="0.9"/>
    <!-- 两端细节点线 -->
    <line x1="12" y1="26" x2="12" y2="38" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="52" y1="26" x2="52" y2="38" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- 核心特征：中央千点红点 -->
    <circle cx="32" cy="32" r="5" fill="#dc2626"/>
    <!-- 红点微光点缀 -->
    <circle cx="30.5" cy="30.5" r="1.5" fill="#fca5a5"/>
  </g>
</svg>
