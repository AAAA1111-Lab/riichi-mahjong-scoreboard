name: Build and Deploy Release Branches

on:
  push:
    branches:
      - main
      - public-server
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npm --prefix frontend ci || npm --prefix frontend install

      - name: Build Frontend
        run: npm run build --prefix frontend

      - name: Determine Target Release Branch
        id: branch-info
        run: |
          if [ "${{ github.ref }}" = "refs/heads/public-server" ]; then
            echo "target_branch=release-server" >> $GITHUB_OUTPUT
            echo "artifact_name=riichi-scoreboard-server-release.zip" >> $GITHUB_OUTPUT
          else
            echo "target_branch=release" >> $GITHUB_OUTPUT
            echo "artifact_name=riichi-scoreboard-lan-release.zip" >> $GITHUB_OUTPUT
          fi

      - name: Prepare Release Artifacts
        run: |
          mkdir -p ../release-bundle
          cp server.js package.json package-lock.json start.sh start-server.bat README.md ../release-bundle/
          if [ -f Dockerfile ]; then cp Dockerfile ../release-bundle/; fi
          if [ -f docker-compose.yml ]; then cp docker-compose.yml ../release-bundle/; fi
          if [ -f nginx.conf.example ]; then cp nginx.conf.example ../release-bundle/; fi
          if [ -f .env.example ]; then cp .env.example ../release-bundle/; fi
          
          mkdir -p ../release-bundle/frontend
          cp -r frontend/dist ../release-bundle/frontend/
          cd ../release-bundle
          zip -r ../${{ steps.branch-info.outputs.artifact_name }} .

      - name: Deploy to Release Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ steps.branch-info.outputs.target_branch }}
          publish_dir: ../release-bundle
          keep_files: false
          force_orphan: true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ../${{ steps.branch-info.outputs.artifact_name }}
