name: Build and Release Packages

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (留空默认使用 package.json 版本号)'
        required: false
        default: ''
      publish_release:
        description: '是否发布/更新 GitHub Releases'
        type: boolean
        default: true
      deploy_branches:
        description: '是否同步部署到 release 与 release-server 分支'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npm --prefix frontend ci || npm --prefix frontend install

      - name: Run Modular & Multi-Room Verification Tests
        run: |
          npm run test:modules
          npm run test:multi-room
          node scripts/test-multi-room-deep.js

      - name: Build Clean Packages (LAN & Server)
        run: |
          node scripts/pack-zip.js --target=all --keep-dir

      - name: Archive Production Artifacts in GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            riichi-scoreboard-lan-release.zip
            riichi-scoreboard-server-release.zip
          retention-days: 14

      - name: Deploy LAN Clean Package to release branch
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_branches != 'false')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: release-bundle-lan
          user_name: 'AAAA1111-Lab'
          user_email: '271276772+AAAA1111-Lab@users.noreply.github.com'
          keep_files: false
          force_orphan: true

      - name: Deploy Server Clean Package to release-server branch
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_branches != 'false')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release-server
          publish_dir: release-bundle-server
          user_name: 'AAAA1111-Lab'
          user_email: '271276772+AAAA1111-Lab@users.noreply.github.com'
          keep_files: false
          force_orphan: true

      - name: Upload Clean Packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release != 'false')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 确定 Release Tag
          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          if [ -n "$INPUT_TAG" ]; then
            RELEASE_TAG="$INPUT_TAG"
          elif [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            VERSION=$(node -p "require('./package.json').version")
            RELEASE_TAG="v$VERSION"
          fi

          echo "Target Release Tag: $RELEASE_TAG"

          # 检查并发布/更新 Release 资产
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists. Updating release assets..."
            gh release upload "$RELEASE_TAG" \
              riichi-scoreboard-lan-release.zip \
              riichi-scoreboard-server-release.zip \
              --clobber
          else
            echo "Creating Release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" \
              riichi-scoreboard-lan-release.zip \
              riichi-scoreboard-server-release.zip \
              --title "Riichi Mahjong Scoreboard $RELEASE_TAG" \
              --generate-notes
          fi
