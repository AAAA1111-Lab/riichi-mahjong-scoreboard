name: Build and Deploy Release Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npm --prefix frontend ci || npm --prefix frontend install

      - name: Build Frontend
        run: npm run build --prefix frontend

      - name: Prepare Release Artifacts
        run: |
          mkdir -p ../release-bundle
          cp server.js package.json package-lock.json start.sh start-server.bat README.md ../release-bundle/
          mkdir -p ../release-bundle/frontend
          cp -r frontend/dist ../release-bundle/frontend/
          cd ../release-bundle
          zip -r ../riichi-scoreboard-release.zip .

      - name: Deploy to Release Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: ../release-bundle
          keep_files: false
          force_orphan: true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ../riichi-scoreboard-release.zip
